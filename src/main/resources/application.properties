# ============================================================
# BASE CONFIGURATION
# Active profile controls which properties file loads next.
# Set via: -Dspring.profiles.active=dev  OR  prod
# ============================================================
spring.profiles.active=dev

# Server port (same for all profiles)
server.port=8080

# ── JPA ──────────────────────────────────────────────────────
# 'update' auto-syncs entity changes with DB schema (dev only).
# Override to 'validate' in prod profile.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ──────────────────────────────────────────────────────
# Secret must be ≥256 bits (32+ chars). Override in prod profile.
app.jwt.secret=HospitalERPSecretKey2024VeryLongSecretKeyAtLeast256BitsRequired123456
# 24 hours in milliseconds
app.jwt.expiration=86400000

# ── Logging ──────────────────────────────────────────────────
logging.level.com.hospital=DEBUG
logging.level.org.springframework.security=DEBUG