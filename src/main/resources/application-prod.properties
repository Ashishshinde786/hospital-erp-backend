# ============================================================
# PROD PROFILE  (spring.profiles.active=prod)
# Supply sensitive values via environment variables \u2014 never commit them.
# ============================================================

# \u2500\u2500 Database \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# Reads from OS environment variables set on the server.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Validate schema only \u2014 never auto-modify in production.
spring.jpa.hibernate.ddl-auto=validate

# Suppress SQL noise in production logs
spring.jpa.show-sql=false
logging.level.com.hospital=INFO
logging.level.org.springframework.security=WARN

# \u2500\u2500 JWT \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# Override with a strong secret from environment
app.jwt.secret=${JWT_SECRET}
# 8 hours in milliseconds
app.jwt.expiration=28800000